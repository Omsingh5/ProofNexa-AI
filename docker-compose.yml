services:
  mysql:
    image: mysql:8.4
    container_name: proofora-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: proofora
      MYSQL_USER: proofora
      MYSQL_PASSWORD: proofora
      MYSQL_ROOT_PASSWORD: proofora-root
    ports:
      - "3306:3306"
    volumes:
      - proofora_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    container_name: proofora-api
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/proofora
      SPRING_DATASOURCE_USERNAME: proofora
      SPRING_DATASOURCE_PASSWORD: proofora
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-at-least-32-chars}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      PROOFORA_EXPOSE_RESET_TOKEN: ${PROOFORA_EXPOSE_RESET_TOKEN:-false}
    ports:
      - "8080:8080"

  web:
    build: ./frontend
    container_name: proofora-web
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  proofora_mysql:
