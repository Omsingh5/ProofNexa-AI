services:
  - type: web
    name: proofnexa
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx300m"
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        value: "http://localhost:*,http://127.0.0.1:*,https://*.onrender.com"
